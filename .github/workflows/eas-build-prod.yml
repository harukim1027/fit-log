name: EAS Build & Submit (Prod)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        required: true
        default: 'ios'
        type: choice
        options: [ios, android, all]

jobs:
  build:
    name: EAS Build – production
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Create eas.json
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > mobile/eas.json << EOF
          {
            "cli": {
              "version": ">= 10.0.0",
              "appVersionSource": "remote"
            },
            "build": {
              "development": {
                "developmentClient": true,
                "distribution": "internal",
                "env": {
                  "APP_ENV": "development"
                }
              },
              "production": {
                "autoIncrement": true,
                "ios": {
                  "buildConfiguration": "Release"
                },
                "env": {
                  "APP_ENV": "production"
                }
              }
            },
            "submit": {
              "production": {
                "ios": {
                  "appleId": "${APPLE_ID}",
                  "ascAppId": "${ASC_APP_ID}",
                  "appleTeamId": "${APPLE_TEAM_ID}"
                }
              }
            }
          }
          EOF

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: false

      - name: Build iOS
        working-directory: mobile
        if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' || github.event_name == 'push'
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.RAILWAY_API_URL }}
        run: eas build --platform ios --profile production --non-interactive

      - name: Build Android
        working-directory: mobile
        if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all'
        run: eas build --platform android --profile production --non-interactive

  submit:
    name: EAS Submit – App Store
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: false

      - name: Submit to App Store
        working-directory: mobile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: eas submit --platform ios --profile production --non-interactive
        continue-on-error: true
