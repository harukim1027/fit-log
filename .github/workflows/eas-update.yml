name: EAS Update (OTA)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/app/**'
      - 'mobile/components/**'
      - 'mobile/store/**'
      - 'mobile/constants/**'

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          eas-cache: false
          expo-cache: false

      # --environment production 이 반드시 있어야 한다.
      # eas update 는 **러너에서** JS 를 번들하고, 그때 EXPO_PUBLIC_* 를 코드에
      # 박아 넣는다. 러너에는 .env 가 없으므로(gitignore) 이 플래그가 없으면
      # EXPO_PUBLIC_API_URL 이 undefined 인 채로 번들되어 localhost 를 가리키는
      # 업데이트가 나간다. 이 플래그가 EAS 서버 환경변수를 끌어온다.
      - name: Publish OTA update
        working-directory: mobile
        run: eas update --branch production --environment production --message "${{ github.event.head_commit.message }}" --non-interactive
