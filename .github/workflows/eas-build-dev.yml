name: EAS Build (Dev)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          eas-cache: false
          expo-cache: false

      - name: Build iOS
        working-directory: mobile
        # development-simulator 프로필: simulator 빌드라 Apple 자격증명이 필요 없다.
        # 이 워크플로에 submit 스텝이 없으므로 자격정보를 주입할 이유도 없다.
        run: eas build --platform ios --profile development-simulator --non-interactive
